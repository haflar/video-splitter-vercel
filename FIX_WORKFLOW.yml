name: Appliquer correctif Blob OIDC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le correctif
        run: |
          unzip -o split120-oidc-fix.zip
          python patch_main.py
          rm split120-oidc-fix.zip patch_main.py

      - name: Enregistrer le correctif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix private Blob OIDC uploads"
          git push
